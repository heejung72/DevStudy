<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그룹 만들기 | 취준스터디</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-bg">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="col-md-5 col-lg-4">

        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3">
                <i class="bi bi-people-fill fs-1 text-warning"></i>
            </div>
            <h2 class="fw-bold text-white">새 그룹 만들기</h2>
            <p class="text-muted">그룹을 만들고 친구를 초대하세요</p>
        </div>

        <div th:if="${errorMsg}" class="alert alert-danger d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMsg}"></span>
        </div>

        <div class="card shadow-lg border-0">
            <div class="card-body p-4">
                <h5 class="card-title fw-bold mb-4">
                    <i class="bi bi-plus-circle me-2 text-success"></i>그룹 정보
                </h5>
                <form th:action="@{/group/new}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">그룹명</label>
                        <input type="text" class="form-control form-control-lg" name="groupName"
                               placeholder="예) 2025 상반기 취준팀" required maxlength="30">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">내 닉네임</label>
                        <input type="text" class="form-control form-control-lg" name="nickname"
                               placeholder="예) 홍길동" required maxlength="20" autocomplete="off">
                        <div class="form-text">그룹에서 사용할 내 이름입니다</div>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg w-100 fw-semibold">
                        <i class="bi bi-check-circle me-2"></i>그룹 생성
                    </button>
                </form>
            </div>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/login}" class="text-muted text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>이미 코드가 있어요
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
