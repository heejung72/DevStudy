<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('스터디', ~{::content})}">
<th:block th:fragment="content">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1"><i class="bi bi-book me-2 text-primary"></i>스터디</h3>
            <p class="text-muted mb-0">함께 공부할 주제를 선택하거나 새로운 스터디를 추가하세요</p>
        </div>
    </div>

    <!-- 성공/에러 메시지 -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- 카테고리 카드 그리드 -->
    <div class="row g-4">

        <!-- 기존 카테고리 카드 -->
        <div th:each="cat : ${categories}" class="col-sm-6 col-md-4 col-lg-3">
            <div class="card study-category-card border-0 shadow-sm h-100">
                <div class="card-body d-flex flex-column text-center p-4">
                    <div class="study-icon-circle mx-auto mb-3"
                         th:style="'background:' + (cat.colorHex != null ? cat.colorHex : '#6c757d')">
                        <i class="bi fs-2 text-white" th:classappend="${cat.icon ?: 'bi-book'}"></i>
                    </div>
                    <h5 class="card-title fw-bold" th:text="${cat.name}">스터디명</h5>
                    <p class="card-text text-muted small flex-grow-1" th:text="${cat.description}">설명</p>
                    <div class="mt-2 mb-3">
                        <span th:if="${cat.lessonCount > 0}" class="badge bg-light text-dark">
                            <i class="bi bi-collection me-1"></i>
                            <span th:text="${cat.lessonCount}">0</span>개 레슨
                        </span>
                        <span th:unless="${cat.lessonCount > 0}" class="badge bg-warning text-dark">
                            준비 중
                        </span>
                    </div>
                    <a th:if="${cat.lessonCount > 0}"
                       th:href="@{/study/{id}/lessons(id=${cat.id})}"
                       class="btn btn-primary btn-sm w-100">
                        <i class="bi bi-play-fill me-1"></i>학습 시작
                    </a>
                    <button th:unless="${cat.lessonCount > 0}"
                            class="btn btn-outline-secondary btn-sm w-100" disabled>
                        <i class="bi bi-hourglass me-1"></i>준비 중
                    </button>
                </div>
            </div>
        </div>

        <!-- 새 스터디 추가 카드 -->
        <div class="col-sm-6 col-md-4 col-lg-3">
            <div class="card study-category-card-add border-0 shadow-sm h-100 border-dashed"
                 style="cursor:pointer" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-4">
                    <div class="add-icon-circle mx-auto mb-3">
                        <i class="bi bi-plus-lg fs-2 text-muted"></i>
                    </div>
                    <h6 class="text-muted fw-semibold">스터디 추가</h6>
                    <small class="text-muted">React, Python, CS 등 새로운 주제를 추가하세요</small>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- 스터디 추가 모달 -->
<div class="modal fade" id="addCategoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/study/new}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">
                        <i class="bi bi-plus-circle me-2 text-primary"></i>새 스터디 추가
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">스터디명 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="name"
                               placeholder="예) React, Python, CS 전공" required maxlength="30">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">설명</label>
                        <input type="text" class="form-control" name="description"
                               placeholder="예) React 기초부터 Hook까지" maxlength="100">
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">아이콘</label>
                            <select class="form-select" name="icon">
                                <option value="bi-code-slash">코드 &lt;/&gt;</option>
                                <option value="bi-lightning-charge">번개 ⚡</option>
                                <option value="bi-database">데이터베이스</option>
                                <option value="bi-cloud">클라우드</option>
                                <option value="bi-phone">모바일</option>
                                <option value="bi-shield-check">보안</option>
                                <option value="bi-graph-up">알고리즘</option>
                                <option value="bi-palette">디자인</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">색상</label>
                            <select class="form-select" name="colorHex">
                                <option value="#61DAFB">React 블루</option>
                                <option value="#3776AB">Python 블루</option>
                                <option value="#42B883">Vue 그린</option>
                                <option value="#E34F26">HTML 오렌지</option>
                                <option value="#6941C6">퍼플</option>
                                <option value="#0EA5E9">스카이 블루</option>
                                <option value="#10B981">에메랄드</option>
                                <option value="#F59E0B">앰버</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-plus me-1"></i>추가하기
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</th:block>
</html>
