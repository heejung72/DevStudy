<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${category?.name ?: '레슨'} + ' 레슨', ~{::content})}">
<th:block th:fragment="content">
<div class="container py-4">

    <!-- 브레드크럼 + 헤더 -->
    <div class="d-flex align-items-center gap-2 mb-3">
        <a th:href="@{/study}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
        </a>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/study}">스터디</a></li>
                <li class="breadcrumb-item active" th:text="${category?.name ?: '레슨'}">레슨</li>
            </ol>
        </nav>
    </div>

    <div class="d-flex align-items-center gap-3 mb-4" th:if="${category != null}">
        <div class="study-icon-circle-sm"
             th:style="'background:' + (category.colorHex != null ? category.colorHex : '#6c757d')">
            <i class="bi fs-4 text-white" th:classappend="${category.icon ?: 'bi-book'}"></i>
        </div>
        <div>
            <h3 class="fw-bold mb-0" th:text="${category.name}">카테고리</h3>
            <small class="text-muted" th:text="${category.description}">설명</small>
        </div>
    </div>

    <p class="text-muted mb-4">
        총 <strong th:text="${#lists.size(lessons)}">0</strong>개의 레슨이 있습니다.
    </p>

    <div th:if="${lessons.empty}" class="text-center py-5 text-muted">
        <i class="bi bi-inbox fs-1 d-block mb-3"></i>
        <p>아직 레슨이 없습니다</p>
    </div>

    <div class="row g-3" th:unless="${lessons.empty}">
        <div class="col-md-6 col-lg-4" th:each="lesson : ${lessons}">
            <div class="card h-100 border-0 shadow-sm lesson-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-secondary" th:text="'Lesson ' + ${lesson.orderNum}"></span>
                        <span class="badge"
                              th:classappend="${lesson.difficulty == '입문'} ? 'bg-success' : (${lesson.difficulty == '초급'} ? 'bg-info' : 'bg-warning text-dark')"
                              th:text="${lesson.difficulty}"></span>
                    </div>
                    <h6 class="card-title fw-bold" th:text="${lesson.title}"></h6>
                    <p class="card-text text-muted small" th:text="${lesson.description}"></p>
                    <div class="d-flex align-items-center gap-2 mt-2">
                        <small class="text-muted">
                            <i class="bi bi-tag me-1"></i><span th:text="${lesson.category}"></span>
                        </small>
                        <small class="text-muted">
                            <i class="bi bi-question-circle me-1"></i>
                            <span th:text="${lesson.questionCount} + '문제'"></span>
                        </small>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-0 pt-0 pb-3">
                    <a th:href="@{/lessons/{id}(id=${lesson.id})}" class="btn btn-primary btn-sm w-100">
                        <i class="bi bi-book-open me-1"></i>학습 시작
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</th:block>
</html>
